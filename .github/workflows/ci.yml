name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # รันทุก push + ทุก PR — typecheck + vitest (มี postgres service ให้ integration test)
  test:
    name: Type check & test
    runs-on: ubuntu-latest

    # integration test ยิงลง PostgreSQL จริง (ดู __tests__/integration/)
    # ⚠️ ชื่อฐานต้องลงท้ายด้วย _test ไม่งั้น assertTestDatabase() ใน
    # __tests__/helpers/db.ts จะ throw ทิ้งทั้ง suite
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: posmobileorderuser
          POSTGRES_PASSWORD: posmobileorderpass
          POSTGRES_DB: posmobileorderdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U posmobileorderuser -d posmobileorderdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # .env.test ถูก .gitignore ครอบไว้ จึงไม่มีบน runner — __tests__/setup.ts จะข้าม
      # การ loadEnv แล้วใช้ค่าจาก env ของ job นี้แทน (ค่าเดียวกับ .env.test บนเครื่อง)
      # port เป็น 5432 ไม่ใช่ 5437 เพราะ service container map ออกมาตรง ๆ
      DATABASE_URL: postgresql://posmobileorderuser:posmobileorderpass@localhost:5432/posmobileorderdb_test?schema=public
      BETTER_AUTH_SECRET: test-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:3001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ไม่ระบุ version — action อ่านจาก field "packageManager" ใน package.json (pnpm@11.22.0)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # /generated/prisma อยู่ใน .gitignore — ถ้าไม่ generate ก่อน tsc จะหา
      # @/generated/prisma ไม่เจอแล้ว typecheck ล้มทันที
      - name: Generate Prisma Client
        run: pnpm db:generate

      # ใช้ prisma migrate deploy ตรง ๆ ไม่ใช่ pnpm db:test:migrate เพราะ script นั้น
      # อ่านค่าผ่าน dotenv -e .env.test ซึ่งไม่มีบน runner
      # (prisma7.config.ts ถูก auto-detect และดึง url จาก process.env.DATABASE_URL)
      - name: Run migrations on test database
        run: pnpm exec prisma migrate deploy

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # build + push image (เฉพาะ push main และต้องรอ test ผ่านก่อน)
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # image หลัก (แอป standalone) → :latest + :sha-xxxx
      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mjdgroup2026-sys/posqrmemberpay
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # image migrate (build จาก stage migrator) → :latest-migrate + :sha-xxxx-migrate
      - name: Docker metadata (migrate image tags)
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mjdgroup2026-sys/posqrmemberpay
          flavor: |
            suffix=-migrate
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator    # <-- ต้องเป็น migrator เท่านั้น: มี prisma/ + prisma7.config.ts + CMD migrate deploy
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # deploy ขึ้น VPS (เฉพาะ push main และต้องรอ build-and-push ผ่านก่อน)
  deploy:
    name: Deploy to production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # copy compose file + สคริปต์ ops/ จาก repo ขึ้น server ทุกครั้งก่อน deploy
      # → ไฟล์บน server = ไฟล์ใน git เสมอ ห้ามแก้ด้วยมือบน server เพราะจะถูกทับ
      # (.env ไม่ copy — เป็น secret ที่จัดการบน server เอง)
      - name: Copy compose file and ops scripts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,ops/*.sh"
          target: "/home/deploy/posmobileorder"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/deploy/posmobileorder
            # scp ไม่รับประกันว่าบิต execute ติดมาด้วย — ตั้งเองทุกรอบ
            chmod +x ops/*.sh || true
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            # เก็บ image ที่กำลังรันไว้เป็น :previous ก่อนดึงตัวใหม่ทับ
            # ตั้ง tag ในเครื่องอย่างเดียว ไม่ push ขึ้น registry — ops/rollback.sh
            # จึงย้อนกลับได้แม้ ghcr.io ล่ม (rollback.sh ใช้ image ในเครื่องก่อนเสมอ)
            docker tag ghcr.io/mjdgroup2026-sys/posqrmemberpay:latest \
                       ghcr.io/mjdgroup2026-sys/posqrmemberpay:previous 2>/dev/null || true

            # ⚠️ ลำดับสำคัญ: pull → migrate → **ค่อย** สลับสี
            #    ถ้าสลับก่อน migrate โค้ดใหม่จะเจอ schema เก่าในช่วงคาบเกี่ยว แล้ว 500 ใส่ลูกค้า
            #
            # ⚠️ ต้องระบุ profile ให้ครบทั้ง tools/blue/green — compose ดึงเฉพาะ service ที่อยู่ใน
            #    profile ที่เปิดไว้เท่านั้น · เขียนแค่ --profile tools จะได้แค่ db กับ migrate
            #    ส่วน image ของแอป (app-blue/app-green) ไม่ถูกดึงเลย แล้ว switch-deploy.sh
            #    ก็สตาร์ตด้วย image เก่าที่ค้างบนเครื่อง = โค้ดเก่าเจอ schema ใหม่ → 500 ทั้งเว็บ
            #    (เกิดจริงตอน deploy รอบแรกหลังแยก blue/green)
            docker compose -f docker-compose.prod.yml --profile tools --profile blue --profile green pull

            # db ต้องขึ้นก่อน migrate — สั่งเฉพาะ service นี้ ไม่แตะสีที่รับ traffic อยู่
            # ⚠️ ห้ามใส่ --remove-orphans: สีที่กำลังให้บริการอยู่คนละ profile จะถูกนับเป็น
            #    orphan แล้วโดนลบทิ้งกลางคัน = downtime เต็ม ๆ
            docker compose -f docker-compose.prod.yml up -d db
            docker compose -f docker-compose.prod.yml --profile tools run --rm migrate

            # สลับ blue/green — สคริปต์ตรวจ health ของสีใหม่ก่อนแตะ nginx และคืนสีเดิมให้เอง
            # ถ้าล้ม (exit code ไม่ใช่ 0 → set -e ทำให้ job แดง แต่ production ยังให้บริการอยู่)
            bash ops/switch-deploy.sh

            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
            bash ops/switch-deploy.sh --status
