# ─────────────────────────────────────────────────────────────────────────────
# MJD Mobile Order (posmobileorder) — stack บน VPS production
#
# ไฟล์นี้ถูก CI (job `deploy` ใน .github/workflows/ci.yml) scp ทับลง
# /home/deploy/posmobileorder/ ทุกครั้งที่ deploy → ไฟล์บน server = ไฟล์ใน git เสมอ
# ห้ามแก้ด้วยมือบนเครื่อง server เพราะจะถูกทับหายในรอบถัดไป
#
# ต่างจาก docker-compose.yml (dev) ตรงนี้:
#   1. ไม่มี build: — ดึง image สำเร็จรูปจาก ghcr.io ที่ CI build ไว้แล้ว
#   2. migrate อยู่ใต้ profile "tools" — CI สั่งรันเองเป็นขั้นแยก ไม่ใช่ depends_on
#   3. พอร์ตผูกกับ 127.0.0.1 เท่านั้น และ db ไม่ map ออก host เลย
#   4. migrate ไม่ seed — ใช้ CMD ของ image (prisma migrate deploy) ตามเดิม
#
# ⚠️ .env ไม่ถูก copy ขึ้นมาโดย CI (เป็นความลับ จัดการบน server เอง)
#    compose auto-load /home/deploy/posmobileorder/.env ให้เองเพราะอยู่โฟลเดอร์เดียวกัน
#    ถ้าไฟล์นั้นหาย จะล้มทันทีที่ POSTGRES_PASSWORD / BETTER_AUTH_SECRET (ใช้ :? ไม่ใช่ :-)
#    ซึ่งเป็นพฤติกรรมที่ต้องการ — ดีกว่าขึ้น production ด้วยรหัสผ่าน default
# ─────────────────────────────────────────────────────────────────────────────
name: posmobileorder

# DATABASE_URL ชี้เข้า service "db" ผ่าน network ภายใน (5432) ไม่ใช่พอร์ตฝั่ง host
# ⚠️ POSTGRES_PASSWORD ห้ามมี / : @ # ? — ค่านี้ถูกเสียบลง URL ตรง ๆ ถ้ามีอักขระพวกนี้
#    @prisma/adapter-pg จะฟ้อง "Invalid URL" แล้วแอปต่อฐานไม่ได้ทั้งระบบ (health 503)
#    สร้างด้วย: openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
x-database-url: &db-url
  DATABASE_URL: "postgresql://${POSTGRES_USER:-posmobileorderuser}:${POSTGRES_PASSWORD:?ยังไม่ได้ตั้ง POSTGRES_PASSWORD ใน .env บน server}@db:5432/${POSTGRES_DB:-posmobileorderdb}?schema=public"

# ค่าที่สีน้ำเงิน/เขียวใช้เหมือนกันทุกอย่าง ต่างกันแค่ container_name / profile / พอร์ต
x-app-base: &app-base
  # APP_TAG ทำให้ ops/rollback.sh ย้อนเวอร์ชันได้โดยไม่ต้องแก้ไฟล์นี้
  # ปกติไม่มีค่านี้ใน .env จึงใช้ latest — rollback.sh จะเขียน APP_TAG=<tag> ลง .env เอง
  image: ghcr.io/mjdgroup2026-sys/posqrmemberpay:${APP_TAG:-latest}
  restart: unless-stopped
  environment:
    <<: *db-url
    NODE_ENV: production
    # ต้องตรงกับ origin ที่เปิดใช้จริงเป๊ะ ๆ (รวม https) ไม่งั้น Better Auth
    # ตอบ INVALID_ORIGIN ตอน sign-in ทั้งที่แอปขึ้นปกติ
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://posqr.jayjayservices.com}
    BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?ยังไม่ได้ตั้ง BETTER_AUTH_SECRET — สร้างด้วย openssl rand -base64 32}"
    # URL ที่ฝังลง QR Code ของโต๊ะ — ต้องเป็นโดเมนที่มือถือลูกค้าเปิดได้จริง (Phase 9)
    APP_BASE_URL: ${APP_BASE_URL:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    MAIL_FROM: ${MAIL_FROM:-}
    MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
    # ชำระเงิน MJD Mobile Order (Phase 10) — ไม่ตั้ง PAYMENT_WEBHOOK_SECRET = webhook ตอบ 503
    # (PROMPTPAY_ID เดิมถอดออกใน Phase 15a — เลขพร้อมเพย์เป็นของร้าน อยู่ในฐานข้อมูล)
    PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
    # ตรวจสลิปอัตโนมัติ (Phase 15b) — ไม่ตั้ง SLIP_PROVIDER = โหมดตรวจสลิปปิด · ห้ามตั้ง mock บน production
    SLIP_PROVIDER: ${SLIP_PROVIDER:-}
    SLIP_API_KEY: ${SLIP_API_KEY:-}
    SLIP_API_BRANCH_ID: ${SLIP_API_BRANCH_ID:-}
    SLIP_MAX_AGE_MINUTES: ${SLIP_MAX_AGE_MINUTES:-30}
    # ค่าใช้งานแบบต่ออายุ (Phase 14b) — พร้อมเพย์ของแพลตฟอร์ม + secret ของ cron เตือนหมดอายุ
    PLATFORM_PROMPTPAY_ID: ${PLATFORM_PROMPTPAY_ID:-}
    CRON_SECRET: ${CRON_SECRET:-}
    # SCB Open API — ไม่ตั้ง = ถอยไปใช้ QR พร้อมเพย์ที่สร้างเอง (พนักงานกดยืนยันเอง)
    # ตั้งครบเมื่อไหร่ SCB จะเป็นคนออก QR ให้ ซึ่งพก ref1 ไปด้วยจึงปิดบิลอัตโนมัติได้
    SCB_API_BASE: ${SCB_API_BASE:-}
    SCB_API_KEY: ${SCB_API_KEY:-}
    SCB_API_SECRET: ${SCB_API_SECRET:-}
    SCB_BILLER_ID: ${SCB_BILLER_ID:-}
    SCB_REF3_PREFIX: ${SCB_REF3_PREFIX:-}
    # ส่วนหนึ่งของ URL ปลายทาง callback — ต้องตรงกับที่ลงทะเบียนไว้ในพอร์ทัล SCB เป๊ะ ๆ
    # ไม่ตั้ง = endpoint ตอบ 503 (ปิดบิลด้วยมือยังทำได้ตามปกติ)
    SCB_WEBHOOK_SECRET: ${SCB_WEBHOOK_SECRET:-}
    # กุญแจเข้ารหัส credential SCB ต่อร้าน (Phase 15c) — 32 ไบต์ base64url · ไม่ตั้ง = ร้านผูก SCB เองไม่ได้ (fail closed) · ห้าม rotate โดยไม่มีแผน
    PAYMENT_CONFIG_KEY: ${PAYMENT_CONFIG_KEY:-}
    # นโยบายการสมัครสมาชิกเอง (lib/signup-allowlist.ts) — ไม่ตั้งอะไรเลย = สมัครไม่ได้สักคน (fail closed)
    # Phase 14a: SIGNUP_OPEN=true เปิดให้ใครก็สมัครได้ (ผู้สมัครใหม่ได้แค่ร้านเปล่าของตัวเอง ไม่เข้าหลังร้านใคร)
    # ⚠️ compose ส่ง env ให้คอนเทนเนอร์เฉพาะที่ประกาศตรงนี้ — ตั้งใน .env อย่างเดียวไม่ถึงแอป
    SIGNUP_OPEN: ${SIGNUP_OPEN:-}
    SIGNUP_ALLOWED_EMAILS: ${SIGNUP_ALLOWED_EMAILS:-}
    SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
  # image มี HEALTHCHECK ในตัวแล้ว (ดู Dockerfile stage runner) จึงไม่ประกาศซ้ำที่นี่
  depends_on:
    db:
      condition: service_healthy
  networks:
    - pos-network

services:
  db:
    # ⚠️ ต้องเป็น 18 เท่านั้น ห้ามลดเป็น 16 — migration 20260828093455_add-auth-models
    # มี ALTER TABLE ... RENAME CONSTRAINT "Product_id_not_null" ซึ่ง PostgreSQL เพิ่งเก็บ
    # NOT NULL constraint ลง pg_constraint ตอน 18 · บน 16 จะล้มด้วย 42704
    image: postgres:18-alpine
    container_name: posmobileorder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-posmobileorderuser}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?ยังไม่ได้ตั้ง POSTGRES_PASSWORD ใน .env บน server}"
      POSTGRES_DB: ${POSTGRES_DB:-posmobileorderdb}
      # กัน locale เพี้ยนตอน initdb — ชื่อสินค้าเป็นภาษาไทย
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      # PG 18+ เก็บข้อมูลใน subdirectory ตามเลข major (/var/lib/postgresql/18/docker)
      # ต้อง mount ที่ /var/lib/postgresql เท่านั้น — ถ้าใช้ .../data แบบ PG 16
      # คอนเทนเนอร์จะตายตั้งแต่บูตพร้อมข้อความ "unused mount/volume"
      - postgres_data:/var/lib/postgresql
    # ⚠️ ไม่มี ports: โดยตั้งใจ — ฐานข้อมูลต้องเข้าถึงได้จาก network ภายในเท่านั้น
    # Docker เขียน iptables เองจึงทะลุกฎ UFW ได้: ถ้าประกาศ "5432:5432" ฐานจะเปิดออก
    # อินเทอร์เน็ตทั้งที่ ufw deny อยู่ (ดู ops/setup-vps.sh ขั้นตอนที่ 4)
    # ต้องเข้าฐานเพื่อ debug ให้ใช้: docker exec -it posmobileorder-db psql -U posmobileorderuser -d posmobileorderdb
    healthcheck:
      # ต้องระบุ -d ด้วย ไม่งั้น pg_isready ตอบ ready ตั้งแต่ initdb ยังสร้างฐานไม่เสร็จ
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posmobileorderuser} -d ${POSTGRES_DB:-posmobileorderdb}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - pos-network

  migrate:
    # ⚠️ image นี้ต้อง build จาก stage `migrator` เท่านั้น (ci.yml job build-and-push)
    # stage deps ไม่มี prisma/ กับ prisma7.config.ts จะฟ้อง "Could not find Prisma Schema"
    # แล้ว deploy "สำเร็จ" ทั้งที่ DB ไม่มีตาราง
    image: ghcr.io/mjdgroup2026-sys/posqrmemberpay:latest-migrate
    container_name: posmobileorder-migrate
    # อยู่ใต้ profile "tools" — `docker compose up -d` เฉย ๆ จะไม่สตาร์ตตัวนี้
    # CI เรียกเองเป็นขั้นแยก: docker compose --profile tools run --rm migrate
    profiles:
      - tools
    restart: "no"
    environment:
      <<: *db-url
      # จำเป็นสำหรับ `pnpm db:create-user` ที่รันผ่าน service นี้ (image runner เป็น standalone
      # build ไม่มี tsx จึงรันสคริปต์ไม่ได้) — better-auth จะ throw "You are using the default
      # secret" ถ้าไม่มีค่านี้ · `prisma migrate deploy` เองไม่ได้ใช้ จึงใช้ :- ไม่ใช่ :?
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://posqr.jayjayservices.com}
    # ไม่ override command โดยตั้งใจ — ใช้ CMD ของ image คือ `prisma migrate deploy` ล้วน
    # ⚠️ ห้ามเติม `prisma db seed` แบบ compose ของ dev เด็ดขาด: seed จะเขียนข้อมูลตัวอย่าง
    # ทับฐาน production ทุกครั้งที่ deploy
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pos-network

  # ── blue/green (Phase 5) ───────────────────────────────────────────────────
  # แอปรันสองชุดที่เหมือนกันทุกอย่างยกเว้นพอร์ต — สีเดียวเท่านั้นที่ nginx ชี้ไปหา
  # ทั้งคู่อยู่ใต้ profile ของตัวเอง จึงไม่มีสีไหนสตาร์ตเองตอน `docker compose up -d` เปล่า ๆ
  # ops/switch-deploy.sh เป็นตัวสั่งสตาร์ต/หยุดทีละสี ห้ามสั่ง up เองตรง ๆ ตอน deploy
  #
  # ⚠️ ห้ามใช้ --remove-orphans กับ compose ไฟล์นี้ระหว่างสลับสี — สีที่ยังรับ traffic อยู่
  #    อยู่คนละ profile จึงถูกนับเป็น orphan แล้วโดนลบทิ้งกลางคัน = downtime เต็ม ๆ
  app-blue:
    <<: *app-base
    container_name: posmobileorder-app-blue
    profiles: [blue]
    ports:
      # ⚠️ ฝั่งขวาต้องเป็น 3000 เสมอ — Dockerfile stage runner ตั้ง ENV PORT=3000
      # ⚠️ ต้องผูกกับ 127.0.0.1 เสมอ Docker เขียน iptables เองจึงทะลุ UFW ได้
      #    เขียน "3001:3000" เฉย ๆ = เปิดพอร์ตออกอินเทอร์เน็ตทั้งที่ ufw deny อยู่
      - "127.0.0.1:${APP_BLUE_PORT:-3001}:3000"

  app-green:
    <<: *app-base
    container_name: posmobileorder-app-green
    profiles: [green]
    ports:
      - "127.0.0.1:${APP_GREEN_PORT:-3002}:3000"

networks:
  pos-network:
    name: pos-network

volumes:
  postgres_data:
    # ⚠️ ตั้ง name: ไว้ตรง ๆ จึงเป็นคนละลูกกับ volume เดิมบน server ที่ชื่อ
    # posmobileorder_postgres_data (compose เติม prefix ให้เพราะไฟล์เก่าไม่ได้ตั้ง name:)
    # ตั้งใจให้เป็นแบบนี้: volume เดิมเป็นข้อมูลของ postgres 16 ซึ่ง PG 18 บูตต่อไม่ได้
    # การใช้ volume ใหม่ทำให้ PG 18 initdb สะอาด โดยไม่ต้องลบของเดิมทิ้ง
    # (ของเดิมไม่มีตารางอยู่แล้ว — migration ไม่เคยรันผ่านบน PG 16 เพราะ
    #  20260828093455_add-auth-models มี RENAME CONSTRAINT ... _not_null ที่ต้องใช้ PG 18)
    # เก็บไว้ก่อนเผื่อตรวจย้อนหลัง จะลบทีหลังด้วย: docker volume rm posmobileorder_postgres_data
    name: postgres_data
